[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dp-wiener-mnist"
version = "0.1.0"
description = "Standalone ExpV1b MNIST DP-SGD and Fisher-Wiener experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.0", "torchvision>=0.15", "opacus>=1.4", "numpy>=1.24", "PyYAML>=6.0"]
[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["dp_wiener_mnist*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
